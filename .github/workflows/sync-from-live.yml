name: Sync from live wiki

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-live
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify concurrent-writer handling with local Git fixtures
        run: python -m unittest discover -s tests -p test_push_wiki_dump.py -v
      - name: Verify exact public export and resume fixtures
        run: python -m unittest discover -s tests -p test_dump_public_current.py -v
      - name: Export exact revisions from all public wiki namespaces
        run: python tools/dump_public_current.py
      - name: Commit and push dump with concurrent-writer retries
        run: |
          git config user.name "swccg-wiki-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/push_wiki_dump.py --attempts 5
