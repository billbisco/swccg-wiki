name: Sync from live wiki

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dump wikitext from wiki.swccg.com
        run: python tools/dump_live.py
      - name: Commit if the dump changed
        run: |
          git config user.name "swccg-wiki-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages
          if git diff --staged --quiet; then
            echo "No wikitext changes"
            exit 0
          fi
          git commit -m "Sync encyclopedia wikitext from wiki.swccg.com"
          git push
