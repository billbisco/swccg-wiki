# Inserted into /etc/nginx/sites-available/test.swccg.com by deploy-staging.sh (between the
# "# >>> wiki-staging" markers). Rollback: rollback-staging.sh restores the backup.
#
# [http context, top of file]
map "$request_method $request_uri" $wiki_staging_acct_post {
    default "";
    "~*^POST .*Special(:|%3A)(UserLogin|PasswordReset|ConfirmEmail|ChangeEmail|ChangePassword|CreateAccount)" $binary_remote_addr;
}
limit_req_zone $wiki_staging_acct_post zone=wiki_staging_acct_post:1m rate=10r/m;
#
# [inside the 443 server, before "location / {"]
    location = /w { return 301 /w/; }
    location /w/ {
        limit_req zone=wiki_staging_acct_post burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:17013/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /wiki { return 301 /wiki/Main_Page; }
    location /wiki/ {
        limit_req zone=wiki_staging_acct_post burst=10 nodelay;
        limit_req_status 429;
        rewrite ^/wiki/(.*)$ /index.php?title=$1 break;
        proxy_pass http://127.0.0.1:17013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /chrome/ {
        alias /opt/swccg-wiki-staging/copy/chrome/;
    }
